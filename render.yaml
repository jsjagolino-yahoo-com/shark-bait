services:
  - type: web
    name: shark-bait
    runtime: node
    rootDir: sharkbait
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: HOST_KEY
        sync: false
  - type: web
    name: beat-em-up
    runtime: node
    rootDir: beatemup
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: HOST_KEY
        sync: false

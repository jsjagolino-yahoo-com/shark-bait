<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140c26">
  <title>Beat 'Em Up</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #joinView {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 50% 30%, #3b1f6e, #140c26 70%);
      touch-action: manipulation;
    }
    .joinCard { width: min(420px, 100%); padding: 28px 22px; text-align: center; }
    .joinCard h1 { font-size: 38px; margin: 0 0 6px; }
    .joinCard p { margin: 0 0 20px; opacity: 0.85; line-height: 1.4; }
    #joinForm { display: flex; flex-direction: column; gap: 12px; }
    #name {
      font: inherit; font-size: 20px; font-weight: 700; padding: 14px 16px;
      border-radius: 14px; border: 0; color: var(--ink); text-align: center;
      -webkit-user-select: text; user-select: text;
    }
    #joinForm button {
      font-size: 22px; font-weight: 900; padding: 14px; border: 0; border-radius: 14px;
      background: var(--hot); color: #fff; box-shadow: 0 5px 0 #a3142f;
    }
    #joinForm button:active { transform: translateY(3px); box-shadow: 0 2px 0 #a3142f; }
    .groupLabel { font-size: 14px; font-weight: 700; opacity: 0.8; margin: 4px 0 -4px; }
    .groupPick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .groupPick button {
      padding: 10px 4px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06); font-size: 15px; font-weight: 900;
    }
    .groupPick button.sel { border-color: currentColor; background: rgba(255,255,255,0.16); box-shadow: inset 0 0 0 2px currentColor; }
    #joinForm .groupPick button { font-size: 16px; padding: 10px 4px; background: rgba(255,255,255,0.06); box-shadow: none; border-radius: 12px; }
    #joinForm .groupPick button.sel { background: rgba(255,255,255,0.18); box-shadow: inset 0 0 0 2px currentColor; }
    #joinForm .groupPick button:active { transform: none; }
    #nameRow { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #groupChip {
      flex-shrink: 0; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 999px;
      border: 1.5px solid currentColor; background: rgba(0,0,0,0.25);
    }
    #groupChip:empty { display: none; }
    #groupChip.can { cursor: pointer; }
    #groupChip.can::after { content: ' ✏️'; font-size: 11px; }
    #pickGrid.groupGrid { grid-template-columns: 1fr; }
    #pickGrid.groupGrid button { font-size: 20px; aspect-ratio: auto; padding: 10px; font-weight: 900; }
    .err { color: #ffb3c1; min-height: 1.2em; margin-top: 12px !important; font-weight: 700; }

    #padView {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 20%, #2c1752, #140c26 75%);
      transition: background 0.15s;
    }
    #padView.hurt { background: radial-gradient(circle at 50% 20%, #7a1030, #2a0a14 75%); }
    #me { display: flex; align-items: center; gap: 12px; }
    #avatar {
      width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%;
      display: grid; place-items: center; font-size: 40px; border: 4px solid #fff;
    }
    #meInfo { flex: 1; min-width: 0; }
    #meName { font-weight: 900; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #hpBar { height: 16px; background: rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; margin-top: 6px; }
    #hpFill { height: 100%; width: 100%; background: var(--ok); transition: width 0.2s, background 0.2s; }
    #hpText { font-size: 13px; opacity: 0.8; margin-top: 3px; }
    #kills { text-align: center; font-weight: 900; font-size: 26px; line-height: 1; }
    #kills small { display: block; font-size: 11px; opacity: 0.7; font-weight: 700; letter-spacing: 0.08em; }

    #status { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 120px; }
    #big { font-size: clamp(30px, 10vw, 52px); font-weight: 900; line-height: 1.05; text-shadow: 0 4px 0 rgba(0,0,0,0.35); }
    #small { font-size: 17px; font-weight: 700; margin-top: 8px; line-height: 1.35; white-space: pre-line; opacity: 0.92; }
    #status.warn #small { background: var(--hot); color: #fff; padding: 8px 12px; border-radius: 12px; align-self: center; animation: flash 0.5s infinite; opacity: 1; }
    #preview { width: 120px; height: 120px; align-self: center; }

    #controls { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    #controls.off { opacity: 0.25; pointer-events: none; }
    #dpad {
      position: relative; width: min(46vw, 230px); aspect-ratio: 1; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18);
      touch-action: none;
    }
    .arrow {
      position: absolute; width: 34%; height: 34%; display: grid; place-items: center;
      font-size: 30px; border-radius: 14px; background: rgba(255,255,255,0.14); color: #fff;
      pointer-events: none; transition: background 0.06s, transform 0.06s;
    }
    .arrow.on { background: var(--violet); transform: scale(1.08); }
    #up { left: 33%; top: 3%; }
    #down { left: 33%; bottom: 3%; }
    #left { left: 3%; top: 33%; }
    #right { right: 3%; top: 33%; }
    #knob {
      position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; margin: -11% 0 0 -11%;
      border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none;
    }
    #hitBtn {
      width: min(40vw, 200px); aspect-ratio: 1; border-radius: 50%; border: 0;
      background: radial-gradient(circle at 35% 30%, #ff7a8f, var(--hot) 60%, #a3142f);
      color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 0.04em;
      box-shadow: 0 8px 0 #7a0f24, 0 10px 30px rgba(255,59,92,0.45);
      touch-action: none;
    }
    #hitBtn.down { transform: translateY(6px); box-shadow: 0 2px 0 #7a0f24; }
    #tools { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    #tools button {
      background: rgba(255,255,255,0.12); color: var(--text); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px;
    }
    #tools #watchBtn.on { background: var(--violet); border-color: var(--violet); }
    #avatarWrap { position: relative; flex-shrink: 0; }
    #avatarWrap.can { cursor: pointer; }
    #editBadge {
      position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; font-size: 14px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #avatarWrap:not(.can) #editBadge { display: none; }
    #watch { width: 100%; flex: 1; min-height: 170px; border: 0; border-radius: 14px; background: #140c26; margin-top: 6px; }
    #padView.watching #preview { display: none; }
    #padView.watching.dead #preview { display: block; width: 76px; height: 76px; margin-bottom: -6px; }
    #padView.watching #status { justify-content: flex-start; min-height: 0; }
    #padView.watching #big { font-size: 22px; }
    #padView.watching #small { font-size: 13px; margin-top: 2px; }
    #padView.watching #status.warn #small { padding: 4px 10px; }
    #picker {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
      background: rgba(10,5,20,0.75); touch-action: manipulation;
    }
    #picker .panel { padding: 16px; width: min(380px, 100%); text-align: center; }
    #picker h3 { margin: 0; font-size: 22px; }
    #pickGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 12px 0 14px; }
    #pickGrid button {
      font-size: 28px; aspect-ratio: 1; border-radius: 12px; padding: 0;
      border: 2px solid transparent; background: rgba(255,255,255,0.08);
    }
    #pickGrid button.sel { border-color: var(--gold); background: rgba(255,204,51,0.2); }
    #pickClose { font-size: 18px; font-weight: 900; padding: 10px 28px; border: 0; border-radius: 12px; background: var(--hot); color: #fff; }
    #conn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--hot); color: #fff; font-weight: 800; padding: 8px 16px; border-radius: 999px;
    }
    /* Phone held sideways: D-pad left, arena / status in the middle, HIT right */
    @media (orientation: landscape) and (max-height: 500px) {
      #padView {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
        gap: 6px 12px; padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      #me { grid-column: 1 / 3; grid-row: 1; gap: 10px; }
      #avatar { width: 44px; height: 44px; font-size: 28px; border-width: 3px; }
      #editBadge { width: 20px; height: 20px; font-size: 11px; }
      #meName { font-size: 17px; }
      #hpBar { height: 12px; margin-top: 4px; }
      #hpText { font-size: 11px; margin-top: 1px; }
      #kills { font-size: 22px; }
      #tools { grid-column: 3; grid-row: 1; margin: 0; align-items: center; flex-direction: column; gap: 4px; }
      #tools button { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
      #controls { display: contents; }
      #controls.off #dpad, #controls.off #hitBtn { opacity: 0.25; pointer-events: none; }
      #dpad { grid-column: 1; grid-row: 2; align-self: center; width: min(58vh, 200px); }
      #hitBtn { grid-column: 3; grid-row: 2; align-self: center; width: min(52vh, 170px); font-size: 28px; }
      #status { grid-column: 2; grid-row: 2; min-height: 0; justify-content: center; }
      #padView.watching #status { justify-content: flex-start; }
      #big { font-size: 26px; }
      #small { font-size: 13px; margin-top: 4px; }
      #preview { display: none; }
      #padView.watching.dead #preview { width: 50px; height: 50px; }
      #watch { min-height: 0; margin-top: 4px; }
    }
  </style>
</head>
<body>
  <section id="joinView">
    <div class="joinCard panel">
      <h1 class="title">🥊 Beat 'Em Up</h1>
      <p>Grab your stick and whack everyone else.<br>Last fighter standing wins!</p>
      <form id="joinForm" autocomplete="off">
        <input id="name" maxlength="16" placeholder="Your name" enterkeyhint="go" autocomplete="off" autocapitalize="words">
        <div class="groupLabel">Your group</div>
        <div id="groupPick" class="groupPick"></div>
        <button type="submit">Enter the arena!</button>
      </form>
      <p id="joinErr" class="err"></p>
    </div>
  </section>

  <section id="padView" class="hidden">
    <div id="me">
      <div id="avatarWrap"><div id="avatar">🐶</div><span id="editBadge">✏️</span></div>
      <div id="meInfo">
        <div id="nameRow"><div id="meName"></div><span id="groupChip"></span></div>
        <div id="hpBar"><div id="hpFill"></div></div>
        <div id="hpText"></div>
      </div>
      <div id="kills">0<small>KOs</small></div>
    </div>
    <div id="tools">
      <button id="watchBtn" type="button">📺 Watch arena</button>
      <button id="leaveBtn" type="button">Change name</button>
    </div>
    <div id="status">
      <canvas id="preview" width="240" height="240"></canvas>
      <div id="big"></div>
      <div id="small"></div>
      <iframe id="watch" class="hidden" title="Arena view"></iframe>
    </div>
    <div id="controls">
      <div id="dpad">
        <div class="arrow" id="up">▲</div>
        <div class="arrow" id="left">◀</div>
        <div class="arrow" id="right">▶</div>
        <div class="arrow" id="down">▼</div>
        <div id="knob"></div>
      </div>
      <button id="hitBtn" type="button">HIT!</button>
    </div>
    <div id="conn" class="hidden">Reconnecting…</div>
  </section>

  <div id="picker" class="hidden">
    <div class="panel">
      <h3 id="pickTitle">Pick your head</h3>
      <div id="pickGrid"></div>
      <button id="pickClose" type="button">Done</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/art.js"></script>
  <script src="/player.js"></script>
</body>
</html>
